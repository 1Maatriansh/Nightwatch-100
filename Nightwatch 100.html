<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nightwatch 100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed sidebar (bottom tab bar on phones) and one calm page column. Each page is a header followed by stacked sections with wide gaps.
   Two worlds share one token set: Night (dark, spotlight and bats) and Day Hero (light, comic ink outlines, halftone, sunburst). */
:root{
  color-scheme:dark;
  --bg:#07080b; --bg2:#0c0e13; --surface:#11141b; --surface2:#181c26;
  --line:#232938; --line2:#343b4f; --ink:#07080b;
  --fg:#eef0f5; --muted:#a3aabd; --dim:#7d869d;
  --accent:#f5c518; --accent-text:#f5c518; --accent-ink:#14110a; --accent-soft:rgba(245,197,24,.12);
  --good:#46d39a; --warn:#ffb347; --bad:#ff5d6c;
  --maths:#ff8f5a; --phys:#62a8ff; --chem:#b58cff;
  --edge:#232938; --edge-w:1px; --shadow-card:0 28px 70px -40px rgba(0,0,0,.95); --shadow-sm:none;
  --r-card:28px;
  --prog-a:#f5c518; --prog-b:#cf9f0b;
  --hero-top:#121a30; --hero-bot:#07080b; --hero-num:#eef0f5; --hero-stroke:0 transparent; --hero-shadow:none;
  --sky-b:#04050a; --win:#f5c518;
  --bg-pattern:radial-gradient(1000px 520px at 92% -8%,rgba(245,197,24,.06),transparent 60%),radial-gradient(900px 520px at -8% 40%,rgba(98,168,255,.045),transparent 60%);
  --show-dk:block; --show-lt:none; --knob-x:0px; --ti-dk:#14110a; --ti-lt:#a3aabd;
  --font-d:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --font-b:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#e4eeff; --bg2:#f1f6ff; --surface:#ffffff; --surface2:#eaf1ff;
  --line:#c5d2ef; --line2:#9fb2dc; --ink:#0b1230;
  --fg:#0b1230; --muted:#46517a; --dim:#65709a;
  --accent:#ffcf2e; --accent-text:#c71f2a; --accent-ink:#0b1230; --accent-soft:rgba(255,207,46,.4);
  --good:#0b8f4d; --warn:#b86e00; --bad:#d62839;
  --maths:#d9480f; --phys:#1d4ed8; --chem:#7c3aed;
  --edge:#0b1230; --edge-w:2.5px; --shadow-card:6px 6px 0 #0b1230; --shadow-sm:3px 3px 0 #0b1230;
  --r-card:24px;
  --prog-a:#e6322b; --prog-b:#ff6a5f;
  --hero-top:#5aa9ff; --hero-bot:#cfe7ff; --hero-num:#ffffff; --hero-stroke:2px #0b1230; --hero-shadow:5px 5px 0 #0b1230;
  --sky-b:#1b2a63; --win:#ffe27a;
  --bg-pattern:radial-gradient(circle,rgba(31,79,224,.16) 1.4px,transparent 1.7px);
  --show-dk:none; --show-lt:block; --knob-x:44px; --ti-dk:#65709a; --ti-lt:#0b1230;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#e4eeff; --bg2:#f1f6ff; --surface:#ffffff; --surface2:#eaf1ff;
  --line:#c5d2ef; --line2:#9fb2dc; --ink:#0b1230;
  --fg:#0b1230; --muted:#46517a; --dim:#65709a;
  --accent:#ffcf2e; --accent-text:#c71f2a; --accent-ink:#0b1230; --accent-soft:rgba(255,207,46,.4);
  --good:#0b8f4d; --warn:#b86e00; --bad:#d62839;
  --maths:#d9480f; --phys:#1d4ed8; --chem:#7c3aed;
  --edge:#0b1230; --edge-w:2.5px; --shadow-card:6px 6px 0 #0b1230; --shadow-sm:3px 3px 0 #0b1230;
  --r-card:24px;
  --prog-a:#e6322b; --prog-b:#ff6a5f;
  --hero-top:#5aa9ff; --hero-bot:#cfe7ff; --hero-num:#ffffff; --hero-stroke:2px #0b1230; --hero-shadow:5px 5px 0 #0b1230;
  --sky-b:#1b2a63; --win:#ffe27a;
  --bg-pattern:radial-gradient(circle,rgba(31,79,224,.16) 1.4px,transparent 1.7px);
  --show-dk:none; --show-lt:block; --knob-x:44px; --ti-dk:#65709a; --ti-lt:#0b1230;
}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--bg-pattern);background-size:auto,auto;color:var(--fg);font-family:var(--font-b);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
:root[data-theme="light"] body{background-size:16px 16px}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) body{background-size:16px 16px}}
h1,h2,h3,h4,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
.dk-only{display:var(--show-dk)}
.lt-only{display:var(--show-lt)}
.eyebrow{font-family:var(--font-m);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{color:var(--muted);font-size:15px}
.fine{color:var(--dim);font-size:13px;line-height:1.55}
.mono{font-family:var(--font-m)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:3px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:36px;padding:36px 24px 28px;background:var(--surface);border-right:var(--edge-w) solid var(--edge);overflow-y:auto}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:46px;height:23px;flex:none;color:var(--accent-text);filter:drop-shadow(0 0 10px var(--accent-soft));animation:hover 4s ease-in-out infinite}
.brand b{display:block;font-family:var(--font-d);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.brand span{display:block;font-family:var(--font-m);font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.nvs{display:flex;flex-direction:column;gap:8px}
.nv{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:14px 18px;border-radius:18px;border:var(--edge-w) solid transparent;background:transparent;color:var(--muted);font-weight:600;font-size:15.5px;transition:background .2s,color .2s,transform .2s,box-shadow .2s}
.nv svg{width:22px;height:22px;flex:none;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.nv:hover{background:var(--surface2);color:var(--fg)}
.nv:hover svg{transform:translateX(3px) rotate(-8deg) scale(1.08)}
.nv:active{transform:scale(.97)}
.nv[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--edge);box-shadow:var(--shadow-sm)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:22px}
.daymini{display:flex;flex-direction:column;gap:10px}
.daymini .row{justify-content:space-between}
.daymini b{font-family:var(--font-m);font-size:13px}
.themewrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.themewrap .tl{font-size:13px;color:var(--muted);font-weight:600;line-height:1.3}
.theme{position:relative;flex:none;width:88px;height:42px;border-radius:99px;border:var(--edge-w) solid var(--edge);background:var(--surface2);display:flex;align-items:center;justify-content:space-between;padding:0 11px;box-shadow:var(--shadow-sm);transition:transform .15s}
.theme:active{transform:scale(.94)}
.theme .knob{position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:50%;background:var(--accent);transform:translateX(var(--knob-x));transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.theme .ti{position:relative;z-index:1;width:20px;height:20px;display:grid;place-items:center}
.theme .ti svg{width:20px;height:16px}
.theme .t-dk{color:var(--ti-dk)}
.theme .t-lt{color:var(--ti-lt)}
.sync{display:flex;align-items:center;gap:9px;font-family:var(--font-m);font-size:11px;color:var(--dim)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.sync.ok i{background:var(--good);box-shadow:0 0 10px var(--good)}
.sync.err i{background:var(--bad)}
.mbar{display:none}
.bnav{display:none}
.main{width:100%;max-width:1180px;margin-inline:auto;min-width:0;padding:64px clamp(24px,5vw,84px) 140px}
.page{display:flex;flex-direction:column;gap:72px}
.page.enter>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.page.enter>*:nth-child(2){animation-delay:.07s}
.page.enter>*:nth-child(3){animation-delay:.14s}
.page.enter>*:nth-child(4){animation-delay:.21s}
.page.enter>*:nth-child(5){animation-delay:.28s}
.page.enter>*:nth-child(6){animation-delay:.35s}
@media (max-width:979px){
  .app{display:block}
  .side{display:none}
  .mbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding:12px 16px;background:var(--surface);border-bottom:var(--edge-w) solid var(--edge)}
  .mbar .brand svg{width:38px;height:19px}
  .mbar .brand b{font-size:17px}
  .mbar .right{display:flex;align-items:center;gap:14px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:var(--edge-w) solid var(--edge)}
  .bn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:16px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:600;transition:background .2s,transform .15s}
  .bn svg{width:22px;height:22px}
  .bn:active{transform:scale(.92)}
  .bn[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
  .main{padding:32px 16px 150px}
  .page{gap:56px}
}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--font-d);font-weight:800;line-height:1.1;text-wrap:balance}
.ph{display:flex;flex-direction:column;gap:16px;max-width:64ch}
.ph h1{font-size:clamp(34px,5.4vw,58px);text-transform:uppercase;letter-spacing:-.005em}
.lead{color:var(--muted);font-size:18px;line-height:1.65}
.sec{display:flex;flex-direction:column;gap:28px;min-width:0}
.sec-h{display:flex;flex-direction:column;gap:8px;max-width:64ch}
.sec-h h2{font-size:clamp(22px,3vw,28px);text-transform:uppercase;letter-spacing:.02em}
.sec-h p{color:var(--muted)}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:var(--edge-w) solid var(--edge);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:clamp(26px,3.6vw,48px);display:flex;flex-direction:column;gap:36px;min-width:0}
.card h3{font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.cols4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
@media (max-width:900px){.cols2,.cols3{grid-template-columns:minmax(0,1fr)}.cols4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:var(--edge-w) solid var(--edge);border-radius:24px;box-shadow:var(--shadow-sm);padding:26px 28px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .v{font-family:var(--font-d);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:18px;color:var(--dim);font-weight:700}
.tile .k{font-family:var(--font-m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .s{font-size:13.5px;color:var(--dim)}
.chip{display:inline-flex;align-items:center;border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700;border:1.5px solid var(--line2);color:var(--muted);white-space:nowrap;background:var(--surface)}
.chip.sM{color:var(--maths);border-color:color-mix(in srgb,var(--maths) 50%,transparent)}
.chip.sP{color:var(--phys);border-color:color-mix(in srgb,var(--phys) 50%,transparent)}
.chip.sC{color:var(--chem);border-color:color-mix(in srgb,var(--chem) 50%,transparent)}
.chip.high{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent-text) 55%,transparent)}
.chip.late{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.sM{--sc:var(--maths)}.sP{--sc:var(--phys)}.sC{--sc:var(--chem)}
.banner{border-radius:18px;padding:16px 20px;background:var(--accent-soft);border:1.5px solid color-mix(in srgb,var(--accent-text) 40%,transparent);color:var(--fg);font-size:15px;font-weight:600}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.insight{border-radius:18px;background:var(--accent-soft);border:1.5px solid color-mix(in srgb,var(--accent-text) 40%,transparent);padding:18px 22px;font-size:15.5px}
.insight b{color:var(--accent-text)}
.empty{border:2px dashed var(--line2);border-radius:22px;padding:40px 28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:6px;font-size:17px;font-family:var(--font-d)}
.stack{display:flex;flex-direction:column;gap:28px}
.scroll-x{overflow-x:auto}

/* ---------- buttons + forms ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 26px;border-radius:99px;border:var(--edge-w) solid var(--line2);background:var(--surface2);color:var(--fg);font-weight:700;font-size:15px;transition:transform .15s,box-shadow .15s,border-color .2s,filter .2s}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .5s}
.btn:hover::after{left:130%}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translate(2px,2px) scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--edge);box-shadow:var(--shadow-sm)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary:active{box-shadow:0 0 0 var(--ink)}
.btn.sm{min-height:38px;padding:0 18px;font-size:13.5px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:transparent}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:10px;font-family:var(--font-m);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;min-width:0}
input,select{font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:var(--fg);background:var(--bg2);border:1.5px solid var(--line2);border-radius:16px;padding:0 16px;min-height:50px;width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--accent-text);box-shadow:0 0 0 4px var(--accent-soft);outline:none}
.actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* ---------- stepper + checks ---------- */
.stepper{display:flex;gap:10px;flex-wrap:wrap}
.step{min-height:46px;padding:0 20px;border-radius:99px;border:1.5px solid var(--line2);background:var(--bg2);color:var(--muted);font-weight:700;font-size:14px;transition:all .2s}
.step:hover{border-color:var(--muted);color:var(--fg);transform:translateY(-2px)}
.step:active{transform:scale(.95)}
.step.on{background:var(--accent);border-color:var(--edge);color:var(--accent-ink);box-shadow:var(--shadow-sm)}
.step.on.l3{background:var(--good);color:#fff}
.checks{display:flex;flex-direction:column;gap:14px}
.check{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:18px 20px;min-height:68px;border-radius:20px;border:1.5px solid var(--line);background:var(--bg2);transition:border-color .2s,transform .15s}
.check:hover{border-color:var(--line2);transform:translateX(3px)}
.check:active{transform:scale(.98)}
.check .box{flex:none;width:28px;height:28px;border-radius:10px;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;font-weight:800;transition:background .2s,border-color .2s}
.check.on{border-color:color-mix(in srgb,var(--good) 55%,transparent)}
.check.on .box{background:var(--good);border-color:var(--good);color:#fff;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.check .t{font-weight:600;display:block}
.check.on .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dim)}
.check small{display:block;color:var(--dim);font-size:13px}

/* ---------- expected questions ---------- */
.eq{display:flex;flex-direction:column;gap:20px}
.eq-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eq ol{display:flex;flex-direction:column;gap:18px}
.eq li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;align-items:start;font-size:15.5px;line-height:1.6}
.eq .qn{font-family:var(--font-m);font-weight:600;font-size:12px;color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:3px 0;text-align:center;border:1px solid var(--edge);margin-top:2px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:36px;border:var(--edge-w) solid var(--edge);box-shadow:var(--shadow-card);background:linear-gradient(180deg,var(--hero-top),var(--hero-bot));padding:clamp(32px,5vw,64px) clamp(26px,5vw,64px) clamp(150px,17vw,190px)}
.hero-in{position:relative;z-index:3;display:flex;flex-direction:column;gap:26px;max-width:560px}
.hero h1{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.hero .dw{font-size:clamp(22px,3vw,34px);font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hero .big{font-size:clamp(88px,15vw,176px);line-height:.85;font-weight:900;color:var(--hero-num);-webkit-text-stroke:var(--hero-stroke);text-shadow:var(--hero-shadow);font-variant-numeric:tabular-nums}
.hero .of{font-size:clamp(24px,3.4vw,38px);font-weight:800;color:var(--dim)}
.hero .sub{font-size:17px;max-width:44ch}
.prog{height:16px;border-radius:99px;border:var(--edge-w) solid var(--edge);background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:repeating-linear-gradient(45deg,var(--prog-a) 0 12px,var(--prog-b) 12px 24px);background-size:34px 34px;animation:stripe 1.4s linear infinite;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.prog.sm{height:10px}
.pill{display:inline-flex;align-items:center;border-radius:99px;border:1.5px solid var(--edge);padding:6px 16px;font-family:var(--font-m);font-size:12.5px;font-weight:600;background:var(--surface);color:var(--fg)}
.pill.hot{background:var(--accent);color:var(--accent-ink)}
.deco{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.beam{position:absolute;right:10%;bottom:0;width:52%;height:130%;transform-origin:50% 100%;background:linear-gradient(to top,rgba(245,197,24,.02),rgba(245,197,24,.3));clip-path:polygon(47% 100%,53% 100%,100% 0,0 0);animation:sweep 9s ease-in-out infinite alternate}
.flash{position:absolute;inset:0;background:#cfe0ff;opacity:0;animation:flash 13s infinite}
.bw{position:absolute;left:0;animation:fly var(--t) linear var(--dl) infinite}
.bw svg{display:block;width:var(--w);height:calc(var(--w)/2);color:#0a0c14;fill:currentColor;filter:drop-shadow(0 0 7px rgba(245,197,24,.3));animation:flap .2s ease-in-out infinite alternate;transform-origin:50% 40%}
.rays{position:absolute;right:-30%;top:-95%;width:140%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.42) 0 7deg,transparent 7deg 14deg);animation:spin 70s linear infinite}

  const span=Math.min(7,Math.max(d,1));let h7=0,a7=0,c7=0,logged=0,sl=0,sn=0;

function cooked(s){
  if(s.d<3)return {calib:true};
  const behind=Math.max(0,-s.pace),avg=s.h7/s.span;
  const acc=s.a7>=20?s.c7/s.a7*100:null;
  const p1=Math.min(40,behind*8),p2=clamp((9-avg)/9,0,1)*35,p3=acc==null?0:clamp((70-acc)/70,0,1)*20,p4=Math.min(5,s.span-s.logged);
  const score=Math.round(clamp(p1+p2+p3+p4,0,100));
  const label=score<20?'Fresh. Keep the lights on.':score<45?'Warming up. Small fixes now.':score<70?'Getting toasty. Fix it this week.':'Cooked. Reset today, not tomorrow.';
  return {calib:false,score:score,label:label,parts:[['Pace',p1,40],['Hours',p2,35],['Accuracy',p3,20],['Missed logs',p4,5]],avg:avg,acc:acc,behind:behind};
}
function advice(s,cm){
  const fix=[],ok=[];
  if(cm.calib)return {fix:fix,ok:ok};
  if(cm.behind>0)fix.push(['Pace','You are '+cm.behind+' chapter'+(cm.behind>1?'s':'')+' behind plan. Use a buffer day, or drop the lowest-yield chapter from the schedule.']);
  else ok.push(['Pace','On or ahead of one chapter a day. Do not add extra chapters. Spend spare time on practice.']);
  if(cm.avg<8)fix.push(['Study hours','Averaging '+cm.avg.toFixed(1)+' h a day against a 9 h target. Protect the 9:00 start and the afternoon practice block.']);
  else ok.push(['Study hours','Averaging '+cm.avg.toFixed(1)+' h a day. This is where it should be.']);
  if(cm.acc==null)fix.push(['Question log','Fewer than 20 questions logged this week. Log attempted and right every night so accuracy can be tracked.']);
  else if(cm.acc<60)fix.push(['Accuracy',Math.round(cm.acc)+'% over the last 7 days. Re-read each question before committing and review the error vault every night.']);
  else if(cm.acc>=75)ok.push(['Accuracy',Math.round(cm.acc)+'% over the last 7 days. Keep the same method.']);
  if(s.sleep!=null){if(s.sleep<6.5)fix.push(['Sleep','Averaging '+s.sleep.toFixed(1)+' h. Below 6.5 h recall drops fast. Move bedtime earlier before adding study time.']);else ok.push(['Sleep','Averaging '+s.sleep.toFixed(1)+' h. Good enough, do not trade it for study time.']);}
  const open=st.errs.filter(e=>!e.r);
  if(open.length){const cnt={};open.forEach(e=>cnt[e.y]=(cnt[e.y]||0)+1);const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
    fix.push(['Error vault',cnt[top]+' of '+open.length+' open errors are "'+top+'". Fix the habit behind that first.']);}
  if(s.d>=28&&!st.mocks.length)fix.push(['Mocks','No mock logged yet. Take one this Sunday and log it.']);
  return {fix:fix,ok:ok};
}

    for(let wy=130-h+9;wy<122;wy+=13){for(let wx=x+6;wx<x+w-7;wx+=10){if(((wx*7+wy*3+i)%9)===0)r+='<rect class="win" style="animation-delay:'+(((wx+wy)%7)*.7).toFixed(1)+'s" x="'+wx+'" y="'+wy+'" width="3.5" height="5"/>';}}
    x+=w+((i*5)%7);i++;}
  return '<div class="sky"><svg viewBox="0 0 1200 130" preserveAspectRatio="none" aria-hidden="true">'+r+'</svg></div>';
}
function phaseOf(d){
  if(d<1)return ['Pre-launch','Day 1 is '+fmtL(START)+'. The plan is loaded. Sleep, then start.'];
  if(d<=N)return ['Learn phase','One chapter a day, highest yield first. Lecture, 30 to 40 questions, error log.'];
  if(d<=80)return ['Buffer days','Finish anything pending, then repair your weakest chapters.'];
  if(d<=100)return ['War room','No new content. Mocks, the error vault and formula revision.'];
  return ['Session time','The 100 days are over. Go and write the paper.'];
}

function related(id){
  const anc=new Set(),des=new Set();
  (function up(x){BY[x].pre.forEach(p=>{if(!anc.has(p)){anc.add(p);up(p);}});})(id);
  (function dn(x){BY[x].next.forEach(n=>{if(!des.has(n)){des.add(n);dn(n);}});})(id);
  return {anc:anc,des:des};
}
function treeHTML(sub){
  const NW=188,NH=68,GX=76,GY=18;
  const nodes=CH.filter(c=>c.sub===sub),layers={},pos={};let rows=0,cols=0;
  nodes.forEach(c=>{(layers[c._d]=layers[c._d]||[]).push(c);});
  Object.keys(layers).forEach(k=>{layers[k].sort((a,b)=>b.w-a.w||a.i-b.i).forEach((c,r)=>{pos[c.id]={x:k*(NW+GX),y:r*(NH+GY)};});rows=Math.max(rows,layers[k].length);cols=Math.max(cols,+k+1);});
  const W=cols*(NW+GX)-GX,H=rows*(NH+GY)-GY;
  let relSet=null;const selOk=ui.sel&&BY[ui.sel]&&BY[ui.sel].sub===sub;
  if(selOk){const r=related(ui.sel);relSet=new Set([ui.sel]);r.anc.forEach(x=>relSet.add(x));r.des.forEach(x=>relSet.add(x));}
  let svg='',html='';
  nodes.forEach(c=>c.pre.forEach(p=>{
    const a=pos[p],b=pos[c.id],x1=a.x+NW,y1=a.y+NH/2,x2=b.x,y2=b.y+NH/2,mx=GX/2;
    let cls='edge';if(selOk){cls+=(relSet.has(p)&&relSet.has(c.id))?' hot':' dim';}
    svg+='<path class="'+cls+'" d="M'+x1+' '+y1+' C'+(x1+mx)+' '+y1+' '+(x2-mx)+' '+y2+' '+x2+' '+y2+'"/>';
  }));
  nodes.forEach(c=>{
    const p=pos[c.id];let cls='node '+SUBS[sub].cls+' s'+S(c.id);
    if(ui.sel===c.id)cls+=' sel';else if(relSet&&relSet.has(c.id))cls+=' rel';else if(selOk)cls+=' dim';
    html+='<button class="'+cls+'" data-act="sel" data-id="'+c.id+'" style="left:'+p.x+'px;top:'+p.y+'px" aria-label="'+esc(c.name)+', weight '+c.w+', '+ST[S(c.id)]+'"><i class="st"></i><span class="nm">'+esc(c.name)+'</span><span class="mt"><span class="bar"><b style="width:'+c.w*10+'%"></b></span><span>W'+c.w+'</span><span>D'+c.day+'</span></span></button>';
  });
  return '<div class="canvas" style="width:'+W+'px;height:'+H+'px"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+svg+'</svg>'+html+'</div>';
}

  }
  const advHTML=cm.calib?'':'<div class="cols2"><div class="stack"><span class="eyebrow">Fix first</span>'+(adv.fix.length?'<ul class="adv fix">'+adv.fix.map(a=>'<li><i></i><div><b>'+a[0]+'</b><span>'+esc(a[1])+'</span></div></li>').join('')+'</ul>':'<div class="empty"><b>Nothing to fix</b>Every tracked number is healthy.</div>')+'</div><div class="stack"><span class="eyebrow">Leave alone</span>'+(adv.ok.length?'<ul class="adv ok">'+adv.ok.map(a=>'<li><i></i><div><b>'+a[0]+'</b><span>'+esc(a[1])+'</span></div></li>').join('')+'</ul>':'<div class="empty"><b>Nothing yet</b>Healthy areas will show up here.</div>')+'</div></div>';
  const acc=s.a7>=1?Math.round(s.c7/s.a7*100)+'<small>%</small>':'<small>-</small>';
  const L=logOf(ymd(s.t));
  const tiles='<div class="cols4"><div class="tile"><span class="k">Chapters covered</span><span class="v">'+s.covered+'<small> / '+N+'</small></span><span class="s">'+CH.filter(c=>S(c.id)===3).length+' revised</span></div>'
    +'<div class="tile"><span class="k">Hours today</span><span class="v">'+(L.hrs||0)+'<small> / 10</small></span><span class="s">'+Math.round(s.total)+' h in total over '+s.days+' days</span></div>'
    +'<div class="tile"><span class="k">7-day accuracy</span><span class="v">'+acc+'</span><span class="s">'+s.a7+' questions attempted</span></div>'
    +'<div class="tile"><span class="k">Streak</span><span class="v">'+s.streak+'<small> days</small></span><span class="s">Days with 6+ hours</span></div></div>';
  const covRow=(label,list,sc)=>{const cv=list.filter(c=>S(c.id)>=2).length;return '<div class="r" style="--sc:'+sc+'"><span>'+label+'</span><i><b style="width:'+(list.length?cv/list.length*100:0)+'%"></b></i><em>'+cv+' / '+list.length+'</em></div>';};
  const cov='<div class="card"><div class="cols2"><div class="stack"><span class="eyebrow">By subject</span><div class="cov">'+covRow('Mathematics',CH.filter(c=>c.sub==='M'),'var(--maths)')+covRow('Physics',CH.filter(c=>c.sub==='P'),'var(--phys)')+covRow('Chemistry',CH.filter(c=>c.sub==='C'),'var(--chem)')+'</div></div><div class="stack"><span class="eyebrow">By weightage</span><div class="cov">'+covRow('High yield',CH.filter(c=>c.w>=7),'var(--accent)')+covRow('Medium yield',CH.filter(c=>c.w>=5&&c.w<7),'var(--accent)')+covRow('Low yield',CH.filter(c=>c.w<5),'var(--accent)')+'</div></div></div></div>';
  return head('Where you stand','Analysis','Your numbers, and what they say to fix and what to leave alone.')
    +sec('Cooked-o-meter','',meter)
    +(cm.calib?'':sec('What to fix','',advHTML))
    +sec('The numbers','',tiles)
    +sec('Coverage','Practice done or revised counts as covered.',cov)
    +sec('Study hours','Last 14 days. Green is 9 h or more, amber is 6 to 9.','<div class="card">'+histHTML()+'</div>');
}

/* ---------- MOCKS ---------- */
function mockChart(ms){
  if(!ms.length)return '';
  const W=680,H=240,L=46,R=24,T=28,B=34,n=ms.length;
  const x=i=>n===1?(L+W-R)/2:L+i*(W-L-R)/(n-1),y=v=>T+(1-(clamp(v,0,300)/300))*(H-T-B);
  let g='';[0,100,200,300].forEach(v=>{g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-10)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';});
  const pts=ms.map((m,i)=>x(i)+','+y(m.t)).join(' ');
  let dots='';ms.forEach((m,i)=>{dots+='<circle class="pt" cx="'+x(i)+'" cy="'+y(m.t)+'" r="7"/><text class="val" x="'+x(i)+'" y="'+(y(m.t)-16)+'" text-anchor="middle">'+m.t+'</text><text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+fmt(new Date(m.d+'T00:00:00'))+'</text>';});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mock total scores over time">'+g+(n>1?'<polyline class="ln" points="'+pts+'"/>':'')+dots+'</svg>';
}
function pageMocks(){
  const ms=st.mocks.slice().sort((a,b)=>a.d<b.d?-1:1),t=today();
  let nextSun=new Date(Math.max(t,MOCK_FROM));while(nextSun.getDay()!==0)nextSun=new Date(nextSun.getFullYear(),nextSun.getMonth(),nextSun.getDate()+1);
  let insight='';
  if(ms.length){
    const avg=k=>Math.round(ms.reduce((a,m)=>a+m[k],0)/ms.length),av={P:avg('p'),C:avg('c'),M:avg('m')};
    const weak=Object.keys(av).sort((a,b)=>av[a]-av[b])[0];
    insight='<div class="insight">Average so far: Physics <b>'+av.P+'</b>, Chemistry <b>'+av.C+'</b>, Maths <b>'+av.M+'</b>. Weakest subject is <b>'+SUBS[weak].n+'</b>. '+(ms.length>1?'Last mock against the first: <b>'+(ms[ms.length-1].t-ms[0].t>=0?'+':'')+(ms[ms.length-1].t-ms[0].t)+'</b> marks.':'Take the next one to see a trend.')+'</div>';
  }
  const rows=ms.slice().reverse().map(m=>'<div class="mrow"><span class="mono">'+fmt(new Date(m.d+'T00:00:00'))+'</span><span class="tot">'+m.t+'</span><span>P '+m.p+'</span><span>C '+m.c+'</span><span>M '+m.m+'</span><span class="note">'+esc(m.n||'')+'</span><button class="btn sm danger" data-act="mock-del" data-id="'+m.id+'">'+(ui.confirm===m.id?'Sure?':'Delete')+'</button></div>').join('');
  const form='<div class="card"><div class="form"><label class="f">Date<input type="date" id="mk-date" value="'+ymd(t)+'"></label><label class="f">Physics<input type="number" id="mk-p" min="-25" max="100" inputmode="numeric" placeholder="out of 100"></label><label class="f">Chemistry<input type="number" id="mk-c" min="-25" max="100" inputmode="numeric" placeholder="out of 100"></label><label class="f">Maths<input type="number" id="mk-m" min="-25" max="100" inputmode="numeric" placeholder="out of 100"></label>'
    +'<label class="f full">What cost you marks<input type="text" id="mk-n" maxlength="200" placeholder="Silly mistakes in Maths, ran out of time in Chemistry"></label></div><div class="actions"><button class="btn primary" data-act="mock-add">Add mock</button></div></div>';
  const trend=ms.length?'<div class="card">'+mockChart(ms)+insight+'<div class="scroll-x"><div>'+rows+'</div></div></div>':'<div class="empty"><b>No mocks yet</b>Your score trend and weakest subject will show up here after the first one.</div>';
  return head('Test series','Mocks','Start in week 4. Each subject is out of 100 here, so a full paper is out of 300.')
    +sec('Log a mock','The first one is due Sunday '+fmt(nextSun)+'.',form)
    +sec('Trend','',trend);
}

/* ---------- VAULT ---------- */
function pageVault(){
  const all=st.errs,open=all.filter(e=>!e.r),list=(ui.errFilter==='open'?open:all).slice().reverse();
  const cnt={};REASONS.forEach(r=>cnt[r]=0);open.forEach(e=>{cnt[e.y]=(cnt[e.y]||0)+1;});
  const mx=Math.max(1,...REASONS.map(r=>cnt[r]));
  const byCh={};open.forEach(e=>{byCh[e.c]=(byCh[e.c]||0)+1;});
  const top=Object.keys(byCh).filter(k=>BY[k]).sort((a,b)=>byCh[b]-byCh[a]).slice(0,5);
  let insight='';
  if(open.length){
    const topR=REASONS.slice().sort((a,b)=>cnt[b]-cnt[a])[0];
    const fix={'Concept gap':'Go back to the lecture notes for the leaking chapter, then redo 10 basic questions before any new PYQs.','Silly mistake':'Slow down for the last 20 seconds of each question. Re-read what is asked and check signs and units.','Time pressure':'Switch to timed sets of 15 questions in 30 minutes. Skip a question after 2 minutes.','Never studied it':'The plan has a hole. Open the chapter map and finish that branch.'}[topR];
    insight='<div class="insight">Most of your open errors are <b>'+topR+'</b> ('+cnt[topR]+' of '+open.length+'). '+fix+(top.length?' Biggest leak: <b>'+esc(BY[top[0]].name)+'</b>.':'')+'</div>';
  }
  const opts=['M','P','C'].map(s=>'<optgroup label="'+SUBS[s].n+'">'+PLAN.filter(c=>c.sub===s).map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</optgroup>').join('');
  const items=list.length?list.map(e=>'<div class="erow'+(e.r?' done':'')+'"><button class="check" data-act="err-res" data-id="'+e.id+'" aria-label="Mark '+(e.r?'open':'resolved')+'"><span class="box">'+(e.r?'&#10003;':'')+'</span></button><div><div class="q">'+esc(BY[e.c]?BY[e.c].name:'Unknown chapter')+'</div><div class="m">'+esc(e.y)+' · '+fmt(new Date(e.d+'T00:00:00'))+(e.n?' · '+esc(e.n):'')+'</div></div><button class="btn sm danger" data-act="err-del" data-id="'+e.id+'">'+(ui.confirm===e.id?'Sure?':'Delete')+'</button></div>').join(''):'<div class="empty"><b>'+(ui.errFilter==='open'?'No open errors':'The vault is empty')+'</b>Every question you get wrong goes here with its reason. This is where marks come from.</div>';
  const form='<div class="card"><div class="form"><label class="f">Chapter<select id="er-ch">'+opts+'</select></label><label class="f">Why you missed it<select id="er-why">'+REASONS.map(r=>'<option>'+r+'</option>').join('')+'</select></label><label class="f full">Note<input type="text" id="er-n" maxlength="200" placeholder="Which question, and what to remember"></label></div><div class="actions"><button class="btn primary" data-act="err-add">Add to vault</button></div></div>';
  const leaks=open.length?sec('Where you leak marks','Open errors only.','<div class="card"><div class="rbars">'+REASONS.map(r=>'<div class="rb"><span>'+r+'</span><i><b style="width:'+cnt[r]/mx*100+'%"></b></i><em>'+cnt[r]+'</em></div>').join('')+'</div>'+insight+(top.length?'<div class="row">'+top.map(k=>'<span class="chip '+SUBS[BY[k].sub].cls+'">'+esc(BY[k].name)+' · '+byCh[k]+'</span>').join('')+'</div>':'')+'</div>'):'';
  const seg='<div class="seg" role="group" aria-label="Filter"><button data-act="err-filter" data-v="open" aria-pressed="'+(ui.errFilter==='open')+'">Open ('+open.length+')</button><button data-act="err-filter" data-v="all" aria-pressed="'+(ui.errFilter==='all')+'">All ('+all.length+')</button></div>';
  return head('Mistake log','Error vault','Log each wrong question right after a practice set. Tick it when you can solve it cold.')
    +sec('Add a mistake','',form)+leaks
    +sec('Questions','',seg+'<div class="list">'+items+'</div>');
}

/* ---------- shell render ---------- */
const PAGES={today:pageToday,chapters:pageChapters,schedule:pageSchedule,analysis:pageAnalysis,mocks:pageMocks,vault:pageVault};
function themeBtn(){return '<button class="theme" data-act="theme" aria-label="Switch between night and day hero theme"><span class="knob"></span><span class="ti t-dk">'+BAT+'</span><span class="ti t-lt">'+STAR+'</span></button>';}
function renderNav(){
  const s=stats(),dd=clamp(s.d,0,100);
  $('#side').innerHTML='<div class="brand">'+BAT+'<div><b>Nightwatch</b><span>100 day JEE plan</span></div></div>'
    +'<nav class="nvs" aria-label="Sections">'+TABS.map(t=>'<button class="nv" data-act="tab" data-v="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+ico(t[0])+'<span>'+t[1]+'</span></button>').join('')+'</nav>'
    +'<div class="side-foot"><div class="daymini"><div class="row"><span class="eyebrow">Day</span><b>'+dd+' / 100</b></div><div class="prog sm"><i style="width:'+dd+'%"></i></div></div>'
    +'<div class="themewrap"><span class="tl"><span class="dk-only">Night</span><span class="lt-only">Day hero</span></span>'+themeBtn()+'</div>'
    +'<div class="sync"><i></i><span>Saved on this device</span></div></div>';
  $('#mbar').innerHTML='<div class="brand">'+BAT+'<div><b>Nightwatch</b></div></div><div class="right"><div class="sync"><i></i><span style="display:none">.</span></div>'+themeBtn()+'</div>';
  $('#bnav').innerHTML=TABS.map(t=>'<button class="bn" data-act="tab" data-v="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+ico(t[0])+'<span>'+t[1]+'</span></button>').join('');
}
function render(o){
  o=o||{};
  const y=window.scrollY,tw=document.querySelector('.tree-wrap'),sl=tw?tw.scrollLeft:0;
  const fa=document.activeElement,fk=(fa&&fa.dataset&&fa.dataset.act)?[fa.dataset.act,fa.dataset.id||'',fa.dataset.v||'',fa.dataset.k||'']:null;
  renderNav();
  const v=$('#view');
  v.innerHTML=PAGES[ui.tab]();
  v.classList.toggle('enter',!!o.enter);
  renderDrawer();
  if(o.enter)window.scrollTo({top:0,behavior:'instant'});else window.scrollTo({top:y,behavior:'instant'});
  const tw2=document.querySelector('.tree-wrap');if(tw2&&!o.enter)tw2.scrollLeft=sl;
  if(fk){const all=document.querySelectorAll('[data-act]');for(let i=0;i<all.length;i++){const e=all[i];if(e.dataset.act===fk[0]&&(e.dataset.id||'')===fk[1]&&(e.dataset.v||'')===fk[2]&&(e.dataset.k||'')===fk[3]&&e.offsetParent!==null){try{e.focus({preventScroll:true});}catch(x){}break;}}}
  if(o.enter)runCounters();
  paintSync();
}
function runCounters(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count;if(reduce()||!to){el.textContent=to;return;}
    const t0=performance.now(),dur=800;
    (function step(t){const p=clamp((t-t0)/dur,0,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e);if(p<1)requestAnimationFrame(step);})(t0);
  });
}

/* ---------- effects ---------- */
function fxAdd(html,ms){const fx=$('#fx');const d=document.createElement('div');d.innerHTML=html;const el=d.firstElementChild;fx.appendChild(el);setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},ms);}
function swarm(){
  if(reduce())return;
  let h='';for(let i=0;i<16;i++){const w=22+Math.round(Math.random()*40),top=4+Math.random()*84,dl=(Math.random()*.5).toFixed(2),dd=(.9+Math.random()*.7).toFixed(2),dy=Math.round(-40+Math.random()*80);
    h+='<div class="fx-bat" style="--w:'+w+'px;--d:'+dd+'s;--dl:'+dl+'s;--dy:'+dy+'px;top:'+top+'%">'+BAT+'</div>';}
  const fx=$('#fx');const wrap=document.createElement('div');wrap.innerHTML=h;while(wrap.firstChild)fx.appendChild(wrap.firstChild);
  setTimeout(()=>{fx.querySelectorAll('.fx-bat').forEach(e=>e.remove());},2400);
}
function boomerang(){if(reduce())return;fxAdd('<div class="fx-throw">'+BOOM+'</div>',1100);}
function burst(txt){
  if(reduce())return;
  let p='';for(let i=0;i<24;i++){const a=i/24*Math.PI*2,r=i%2?34:50;p+=(50+Math.cos(a)*r).toFixed(1)+','+(50+Math.sin(a)*r).toFixed(1)+' ';}
  fxAdd('<div class="fx-burst"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="'+p+'" fill="#ffd23a" stroke="#0b1230" stroke-width="2.4" stroke-linejoin="round"/><polygon points="'+p+'" fill="none" stroke="#e6322b" stroke-width="1" transform="translate(50 50) scale(.8) translate(-50 -50)"/><text x="50" y="57" text-anchor="middle" fill="#0b1230" transform="rotate(-6 50 50)">'+txt+'</text></svg></div>',1000);
}
function toast(msg){
  const box=$('#toasts'),el=document.createElement('div');el.className='toast';el.textContent=msg;box.appendChild(el);
  while(box.children.length>3)box.removeChild(box.firstChild);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},320);},2400);
}

/* ---------- theme ---------- */
function curTheme(){const a=document.documentElement.getAttribute('data-theme');if(a==='light'||a==='dark')return a;return (window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('nw.theme',t);}catch(e){}
  if(t==='dark'){swarm();toast('Night watch is on');}else{burst('POW!');toast('Day hero mode');}
}
try{const t=localStorage.getItem('nw.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}

/* ---------- actions ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function act(a,b){
  const id=b.dataset.id,v=b.dataset.v;
  if(a==='tab'){
    if(ui.tab===v){window.scrollTo({top:0,behavior:'smooth'});return;}
    ui.tab=v;ui.sel=null;ui.confirm=null;try{localStorage.setItem('nw.tab',v);}catch(e){}
    render({enter:true});return;}
  if(a==='theme'){setTheme(curTheme()==='dark'?'light':'dark');return;}
  if(a==='status'){
    const was=S(id),nv=+v;setS(id,nv);persist();render();
    if(nv>=2&&was<2){boomerang();toast('Chapter cleared: '+BY[id].name);}else if(nv===3&&was<3)toast('Revised. It sticks now.');else if(nv===1&&was<1)toast('Lecture done. Now practice.');
    return;}
  if(a==='task'){
    const k=ymd(today());st.tasks[k]=st.tasks[k]||{};const on=!st.tasks[k][b.dataset.k];st.tasks[k][b.dataset.k]=on;
    const nx=todayChapter();if(on&&nx){if(b.dataset.k==='lec')setS(nx.id,Math.max(S(nx.id),1));if(b.dataset.k==='prac')setS(nx.id,Math.max(S(nx.id),2));}
    persist();render();
    if(on&&['lec','prac','err','rec'].every(x=>st.tasks[k][x])){swarm();toast('Mission complete. Go sleep well.');}
    else if(on&&b.dataset.k==='prac'&&nx&&S(nx.id)===2)boomerang();
    return;}
  if(a==='next-ch'){
    const n=nextChapter();if(!n)return;
    st.focus={d:ymd(today()),id:n.id};st.tasks[ymd(today())]={};persist();render({enter:true});toast('Loaded: '+n.name);return;}
  if(a==='sel'){ui.tab='chapters';if(ui.csub!=='W')ui.csub=BY[id].sub;ui.sel=id;render();return;}
  if(a==='goto'){
    const fromOther=ui.tab!=='chapters';ui.tab='chapters';ui.csub=BY[id].sub;ui.sel=id;try{localStorage.setItem('nw.tab','chapters');}catch(e){}
    render({enter:fromOther});
    const n=document.querySelector('.node.sel'),w=document.querySelector('.tree-wrap');
    if(n&&w)w.scrollLeft=Math.max(0,n.offsetLeft+36-w.clientWidth/2+94);
    return;}
  if(a==='clear'){ui.sel=null;render();return;}
  if(a==='csub'){ui.csub=v;ui.sel=null;render({enter:true});return;}
  if(a==='save-log'){
    const k=ui.logDate||ymd(today());st.log[k]=st.log[k]||{};
    document.querySelectorAll('[data-lg]').forEach(i=>{const f=i.dataset.lg;if(f==='note')st.log[k].note=i.value;else if(i.value==='')delete st.log[k][f];else st.log[k][f]=num(i.value);});
    persist();render();boomerang();toast('Log saved for '+fmt(new Date(k+'T00:00:00')));return;}
  if(a==='mock-add'){
    const g=i=>document.getElementById(i),p=g('mk-p').value,c=g('mk-c').value,m=g('mk-m').value;
    if(p===''||c===''||m===''){toast('Fill in all three subject scores');return;}
    const P=num(p),C=num(c),M=num(m);st.mocks.push({id:uid(),d:g('mk-date').value||ymd(today()),p:P,c:C,m:M,t:P+C+M,n:g('mk-n').value.trim()});persist();render();toast('Mock added: '+(P+C+M)+' / 300');return;}
  if(a==='mock-del'){if(ui.confirm!==id){ui.confirm=id;render();return;}st.mocks=st.mocks.filter(x=>x.id!==id);ui.confirm=null;persist();render();toast('Mock deleted');return;}
  if(a==='err-add'){const g=i=>document.getElementById(i);st.errs.push({id:uid(),c:g('er-ch').value,y:g('er-why').value,n:g('er-n').value.trim(),d:ymd(today()),r:false});persist();render();toast('Added to the vault');return;}
  if(a==='err-res'){const e=st.errs.find(x=>x.id===id);if(e){e.r=!e.r;persist();render();toast(e.r?'Resolved. Cold solve confirmed.':'Back in the open list');}return;}
  if(a==='err-del'){if(ui.confirm!==id){ui.confirm=id;render();return;}st.errs=st.errs.filter(x=>x.id!==id);ui.confirm=null;persist();render();return;}
  if(a==='err-filter'){ui.errFilter=v;render();return;}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sel&&ui.tab==='chapters'){ui.sel=null;render();}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='lg-date'){ui.logDate=t.value||null;render();return;}
  if(t.dataset&&t.dataset.lg){
    const k=ui.logDate||ymd(today());st.log[k]=st.log[k]||{};const f=t.dataset.lg;
    if(f==='note')st.log[k].note=t.value;else if(t.value==='')delete st.log[k][f];else st.log[k][f]=num(t.value);
    persist();
  }
});
render({enter:true});
initSync();
})();
</script>
